# nginx — Le Ville Pet
# Serve o SPA com fallback para index.html (roteamento client-side)
server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip para assets de texto
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Cache forte para assets com hash (Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html nunca cacheado (para atualizações instantâneas)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — todas as rotas internas (/fotos, /albuns, /admin...) voltam para o index
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Redirecionamento www -> apex
    if ($host ~* ^www\.(.+)$) {
        return 301 https://$1$request_uri;
    }
}
