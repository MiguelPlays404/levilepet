# nginx — Le Ville Pet
# Serve o SPA com fallback para index.html (roteamento client-side)
server {
    listen       7070 default_server;
    listen  [::]:7070 default_server;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Nunca deixa a conexão pendurada (evita 502 no proxy)
    keepalive_timeout 65;
    client_max_body_size 25m;

    # Gzip para assets de texto
    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;
    gzip_min_length 1024;

    # Endpoint de healthcheck (usado pelo Docker/Dokploy)
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Cache forte para assets com hash (Vite)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Ícones e arquivos de raiz: servem o arquivo real ou 404 (sem cair no SPA)
    location ~* ^/(favicon\.ico|favicon\.png|apple-touch-icon\.png|robots\.txt|sitemap\.xml)$ {
        try_files $uri =404;
    }

    # index.html nunca cacheado (para atualizações instantâneas)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — todas as rotas internas (/fotos, /albuns, /admin...) voltam para o index
    location / {
        try_files $uri $uri/ /index.html;
    }
}
