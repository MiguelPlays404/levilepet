[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: rotas internas (/fotos, /albuns...) funcionam ao recarregar
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Domínio principal sem www
[[redirects]]
  from = "https://www.levillepet.com.br/*"
  to = "https://levillepet.com.br/:splat"
  status = 301
  force = true
