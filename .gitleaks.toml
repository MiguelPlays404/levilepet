# Regras do gitleaks para o Le Ville Pet
# O repositório é público: nenhum segredo pode ser commitado.
[extend]
useDefault = true

[allowlist]
description = "Valores públicos por natureza (chave publicável/anon do backend e IDs de projeto)"
regexes = [
  '''VITE_SUPABASE_PUBLISHABLE_KEY''',
  '''VITE_SUPABASE_PROJECT_ID''',
  '''VITE_SUPABASE_URL''',
]
paths = [
  '''src/integrations/supabase/types\.ts''',
  '''bun\.lockb''',
  '''package-lock\.json''',
]
