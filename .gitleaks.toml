# Regras do gitleaks para o Le Ville Pet
# O repositório é público: nenhum segredo pode ser commitado.
[extend]
useDefault = true

[allowlist]
description = "Valores públicos por natureza (chave publicável/anon do backend e IDs de projeto)"
regexes = [
  '''VITE_SUPABASE_PUBLISHABLE_KEY''',
  '''VITE_SUPABASE_PROJECT_ID''',
  '''VITE_SUPABASE_URL''',
]
paths = [
  '''src/integrations/supabase/types\.ts''',
  '''bun\.lockb''',
  '''package-lock\.json''',
]

[[rules]]
id = "sql-plaintext-password-in-crypt"
description = "Senha em texto puro dentro de crypt(...) em migração SQL"
regex = '''crypt\(\s*'[^']{4,}'\s*,'''
tags = ["sql", "password", "custom"]
