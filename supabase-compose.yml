# ─────────────────────────────────────────────────────────────
#  Supabase self-hosted para Dokploy — Le Ville Pet
#  Stack baseada nas imagens oficiais do Supabase.
#
#  Antes de subir no Dokploy:
#  1. Copie supabase/.env.example para .env e preencha os valores.
#  2. Ajuste os domínios e volumes conforme a sua configuração no Dokploy.
#  3. Suba este arquivo como um serviço separado no Dokploy.
# ─────────────────────────────────────────────────────────────

services:
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: supabase-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Precisa definir POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
    volumes:
      - supabase-db-data:/var/lib/postgresql/data
      # Inicializa extensões e schemas do Supabase
      - ./supabase/volumes/db/init:/docker-entrypoint-initdb.d
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - supabase-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  supabase-kong:
    image: supabase/kong:2.8.1
    container_name: supabase-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,SRV,CNAME
    volumes:
      - ./supabase/volumes/kong.yml:/var/lib/kong/kong.yml:ro
    ports:
      - "${KONG_PORT:-8000}:8000"
    networks:
      - supabase-network
    depends_on:
      - supabase-auth
      - supabase-rest
      - supabase-realtime
      - supabase-storage
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: always

  supabase-auth:
    image: supabase/gotrue:v2.158.1
    container_name: supabase-auth
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL:?Precisa definir API_EXTERNAL_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}?sslmode=disable
      GOTRUE_JWT_SECRET: ${JWT_SECRET:?Precisa definir JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_SITE_URL: ${SITE_URL:?Precisa definir SITE_URL}
      GOTRUE_REDIRECT_URLS: ${SITE_URL}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-mail}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-2500}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_SENDER_NAME: ${SMTP_SENDER_NAME:-Le Ville Pet}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      GOTRUE_MAILER_URLPATHS_INVITE: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
    networks:
      - supabase-network
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: always

  supabase-rest:
    image: postgrest/postgrest:v12.2.0
    container_name: supabase-rest
    environment:
      PGRST_DB_URI: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_EXTRA_SEARCH_PATH: public,extensions
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_OPENAPI_SERVER_PROXY_URI: ${API_EXTERNAL_URL}
    networks:
      - supabase-network
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: always

  supabase-realtime:
    image: supabase/realtime:v2.30.25
    container_name: supabase-realtime
    environment:
      PORT: 4000
      DB_HOST: supabase-db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB:-postgres}
      DB_SSL: "false"
      JWT_SECRET: ${JWT_SECRET}
      APP_NAME: realtime
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Precisa definir SECRET_KEY_BASE}
      ERL_AFLAGS: "-proto_dist inet_tcp"
    networks:
      - supabase-network
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: always

  supabase-storage:
    image: supabase/storage-api:v1.0.10
    container_name: supabase-storage
    environment:
      ANON_KEY: ${ANON_KEY:?Precisa definir ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY:?Precisa definir SERVICE_ROLE_KEY}
      POSTGREST_URL: http://supabase-rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@supabase-db:5432/${POSTGRES_DB:-postgres}
      FILE_SIZE_LIMIT: 524288000
      STORAGE_BACKEND: s3
      GLOBAL_S3_BUCKET: ${S3_BUCKET:-levillepet-media}
      GLOBAL_S3_ENDPOINT: ${S3_ENDPOINT:-}
      GLOBAL_S3_PROTOCOL: https
      GLOBAL_S3_FORCE_PATH_STYLE: "true"
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
      TENANT_ID: ${TENANT_ID:-}
      ENABLE_IMAGE_TRANSFORMATION: "true"
    networks:
      - supabase-network
    depends_on:
      supabase-db:
        condition: service_healthy
      supabase-rest:
        condition: service_started
    restart: always

  supabase-meta:
    image: supabase/postgres-meta:v0.83.2
    container_name: supabase-meta
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: supabase-db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: ${POSTGRES_DB:-postgres}
      PG_META_DB_USER: ${POSTGRES_USER:-postgres}
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - supabase-network
    depends_on:
      supabase-db:
        condition: service_healthy
    restart: always

  supabase-studio:
    image: supabase/studio:20240422-5f28ebe
    container_name: supabase-studio
    environment:
      STUDIO_PG_META_URL: http://supabase-meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION: Le Ville Pet
      DEFAULT_PROJECT: levillepet
      SUPABASE_URL: http://supabase-kong:8000
      SUPABASE_PUBLIC_URL: ${API_EXTERNAL_URL}
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    ports:
      - "${STUDIO_PORT:-3001}:3000"
    networks:
      - supabase-network
    depends_on:
      - supabase-kong
      - supabase-meta
    restart: always

volumes:
  supabase-db-data:

networks:
  supabase-network:
    external: true
